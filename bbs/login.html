<div id="mb_login" class="mbskin">
    <h1>로그인</h1>

    <form name="flogin" action="bbs/login_check.html" onsubmit="return flogin_submit(this);" method="post">
    <input type="hidden" name="url" value="..%2Fbbs%2Fqalist.html">

    <fieldset id="login_fs">
        <legend>회원로그인</legend>
        <label for="login_id" class="sound_only">회원아이디<strong class="sound_only"> 필수</strong></label>
        <input type="text" name="mb_id" id="login_id" required class="frm_input required" size="20" maxLength="20" placeholder="아이디">
        <label for="login_pw" class="sound_only">비밀번호<strong class="sound_only"> 필수</strong></label>
        <input type="password" name="mb_password" id="login_pw" required class="frm_input required" size="20" maxLength="20" placeholder="비밀번호">
        <input type="submit" value="로그인" class="btn_submit">
        <input type="checkbox" name="auto_login" id="login_auto_login">
        <label for="login_auto_login">자동로그인</label>
    </fieldset>

    
    <aside id="login_info">
        <h2>회원로그인 안내</h2>
            <a href="password_lost.html" target="_blank" id="login_password_lost">아이디 비밀번호 찾기</a>
            <a href="register.html">회원 가입</a>
        </div>
    </aside>

    </form>

    
        
        <!-- 주문하기, 신청하기 -->
        
        
    </form>

</div>

<script>
$(function(){
    $("#login_auto_login").click(function(){
        if (this.checked) {
            this.checked = confirm("자동로그인을 사용하시면 다음부터 회원아이디와 비밀번호를 입력하실 필요가 없습니다.\n\n공공장소에서는 개인정보가 유출될 수 있으니 사용을 자제하여 주십시오.\n\n자동로그인을 사용하시겠습니까?");
        }
    });
});

function flogin_submit(f)
{
    return true;
}
</script>
