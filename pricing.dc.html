<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>비핏 바디핏 요금 플랜</title>
<!-- 요금·구매는 bfitdaily.kr 로 옮겼다. 옛 링크(#business, #contact 등)를 이어 준다. -->
<link rel="canonical" href="https://bfitdaily.kr/bodyfit/plans/">
<meta name="robots" content="noindex">
<script>
(function () {
  var base = 'https://bfitdaily.kr/bodyfit/plans/';
  var hash = location.hash.replace('#', '').toLowerCase();
  var plans = { starter: 'STARTER', business: 'BUSINESS', pro: 'PRO', enterprise: 'ENTERPRISE' };
  var to = base;
  if (hash === 'contact') to = 'index.html#contact';
  else if (plans[hash]) to = base + '?plan=' + plans[hash];
  location.replace(to);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://bfitdaily.kr/bodyfit/plans/"></noscript>
</head>
<body>
<p>요금 플랜은 <a href="https://bfitdaily.kr/bodyfit/plans/">bfitdaily.kr</a> 에서 볼 수 있습니다.</p>
</body>
</html>
